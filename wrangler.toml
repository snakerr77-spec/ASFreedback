name = "amor-saudefreedback"
main = "src/index.js"
compatibility_date = "2026-07-04"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# IMPORTANTE:
# O banco D1 deve ser ligado no painel da Cloudflare como binding chamado DB.
# Não coloque DB em Variáveis e segredos. DB é uma vinculação D1.

# O login agora consulta usuários no D1 pela rota /api/login.
# Não há usuário e senha salvos no JavaScript público do site.
